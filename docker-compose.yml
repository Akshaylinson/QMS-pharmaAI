services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://qms:qms@db:5432/qms}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.7-flash}"
      GEMINI_FALLBACK_MODEL: "${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api}" }
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
